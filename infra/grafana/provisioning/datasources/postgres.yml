apiVersion: 1
datasources:
  - name: Retail PostgreSQL
    uid: retail-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: warehouse:5432
    user: grafana_reader
    isDefault: true
    jsonData:
      database: retail
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
